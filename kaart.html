<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaart – Glasmeesters Planner</title>
  <meta name="theme-color" content="#2A5577">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icoon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icoon-180.png">
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/stijl.css">
  <link rel="stylesheet" href="css/kaart.css">
</head>
<body data-pagina="kaart">

  <main class="inhoud">
    <div class="paginakop">
      <div>
        <h1 id="titel">Kaart</h1>
        <p class="ondertitel" id="samenvatting">Bezig met laden…</p>
      </div>
      <a class="knop" id="dagroute" href="#" target="_blank" rel="noopener" hidden>🧭 Route van de dag</a>
    </div>

    <div class="filterbalk kaart-filters">
      <select id="periode" aria-label="Periode">
        <option value="vandaag">Vandaag</option>
        <option value="morgen">Morgen</option>
        <option value="week">Deze week</option>
        <option value="volgende">Volgende week</option>
        <option value="open">Alles wat nog open staat</option>
      </select>
      <label class="vinkje" id="toon-klussen-label"><input type="checkbox" id="toon-klussen" checked> Werkopdrachten</label>
      <label class="vinkje" id="toon-opnames-label"><input type="checkbox" id="toon-opnames" checked> Opnames</label>
      <label class="vinkje"><input type="checkbox" id="toon-zones" checked> <span class="legenda-vlak ze"></span>Zones</label>
      <label class="vinkje"><input type="checkbox" id="toon-parkeren" checked> 🅿️ Parkeren</label>
      <button type="button" class="knop tweede klein" id="parkeer-nieuw" hidden>+ Parkeerinfo</button>
    </div>

    <div class="melding" id="melding"></div>

    <div class="kaart-indeling">
      <div class="kaart-vak">
        <div id="kaart" role="region" aria-label="Kaart met klussen"></div>
        <div class="kaart-plaatsen" id="plaatsen-balk" hidden>
          <span id="plaatsen-tekst"></span>
          <button type="button" class="knop tweede klein" id="plaatsen-stop">Annuleren</button>
        </div>
      </div>
      <div class="kaart-lijst" id="lijst"></div>
    </div>
  </main>

  <!-- Parkeerinfo toevoegen -->
  <dialog id="parkeer-venster" class="venster">
    <form id="parkeer-form" method="dialog">
      <div class="venster-kop"><h2>Parkeerinfo</h2><button type="button" class="sluit" data-parkeer-sluit aria-label="Sluiten">✕</button></div>
      <div class="venster-inhoud">
        <div class="veld"><label for="p-soort">Soort</label><select id="p-soort"></select></div>
        <div class="veld"><label for="p-tekst">Toelichting</label><textarea id="p-tekst" rows="3" class="vol" placeholder="Bijv. laad- en losplek tot 11.00 uur, sleutel slagboom bij de buren"></textarea></div>
      </div>
      <div class="venster-voet"><span class="ruimte"></span>
        <button type="button" class="knop tweede" data-parkeer-sluit>Annuleren</button>
        <button type="submit" class="knop">Opslaan</button>
      </div>
    </form>
  </dialog>

  <script src="lib/leaflet/leaflet.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/opslag.js"></script>
  <script src="js/keuzelijsten.js"></script>
  <script src="js/voorbeeld.js"></script>
  <script src="js/zones.js"></script>
  <script src="js/kaart.js"></script>
</body>
</html>
